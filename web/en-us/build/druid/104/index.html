<p>Druid Guardian Gear Planner: assemble a full Druid Guardian build, compute item level and crit/haste/mastery/versatility live, and apply a WCL leaderboard build in one click.</p>
<h2>FAQ</h2>
<dl>
<dt>What armor does Druid Guardian wear?</dt>
<dd>Druid uses Leather.</dd>
<dt>Which gear slots does Druid Guardian use?</dt>
<dd>Builds cover these slots: Head, Neck, Shoulder, Cloak, Chest, Wrist, Hands, Waist, Legs, Feet, Ring, Trinket, Weapon (with weapon/off-hand rules).</dd>
<dt>How much Druid Guardian gear is available and where from?</dt>
<dd>140 items this season, from sources such as Seat of the Triumvirate, Pit of Saron, Skyreach, Algeth'ar Academy, Windrunner's Tower, Magisters' Terrace, Node Shinas, Mythsara Caverns.</dd>
<dt>Which secondary stats do top Druid Guardian builds stack?</dt>
<dd>Based on top WCL logs (24 builds), average secondary stat rating per Druid Guardian build (by raw rating) is Haste ≈ 1038, Mastery ≈ 453, Versatility ≈ 428, Crit ≈ 331. An objective tally of top-log gear, not a prescriptive priority.</dd>
<dt>How do I use this gear planner?</dt>
<dd>Pick a class and spec, click a slot to choose from spec-usable gear, and watch item level and crit/haste/mastery/versatility update live. Save builds, share links, or apply a WCL leaderboard build in one click.</dd>
