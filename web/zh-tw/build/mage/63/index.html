      <h1>法師 火焰 Gear Planner</h1>
<p>法師 火焰 Gear Planner：为法師火焰专精组装整套装备，实时计算平均装等、暴击/急速/精通/全能百分比与主属性、耐力，并可一键套用 WCL 排行榜配装。</p>
<h2>常见问题</h2>
<dl>
<dt>法師火焰能穿什么护甲？</dt>
<dd>法師使用布甲。</dd>
<dt>法師火焰有哪些装备槽？</dt>
<dd>配装涵盖以下部位：頭、項鍊、肩、披風、胸、腕、手、腰、腿、腳、戒、飾、武（含双持/副手规则）。</dd>
<dt>火焰法师的精通是什么？</dt>
<dd>精通：点燃，主要提升点燃伤害。</dd>
<dt>本赛季法師火焰有多少可用装备、来自哪里？</dt>
<dd>当前赛季共有 162 件可用装备，来源包括 三傑議會之座、薩倫之淵、擎天峰、阿爾蓋薩學院、風行者之塔、博學者殿堂、希納斯節點、秘薩拉洞窟 等。</dd>
<dt>法師火焰的副属性怎么堆？</dt>
<dd>据 WCL 高分日志统计（样本 24 套），前列法師火焰每套装备的平均副属性 rating（按原始数值累积）依次为 加速 ≈ 1130、精通 ≈ 803、臨機 ≈ 147、致命 ≈ 98。此为对高分日志装备的客观统计，非绝对最优优先级。</dd>
<dt>怎么用这个配装模拟器？</dt>
<dd>选择职业与专精，点击装备槽从当前专精可用装备中选装，实时查看平均装等、暴击/急速/精通/全能百分比与主属性、耐力；可保存方案、分享链接，或一键套用 WCL 排行榜配装。</dd>
</dl>
<h2>法師火焰各部位可用最高装等装备</h2>
