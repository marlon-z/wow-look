name: Update WCL Presets

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Preset target to update'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - fire-mage
          - windwalker-monk
  schedule:
    - cron: '20 20 * * *'

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate WCL preset data
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
          WCL_PRESET_TARGET: ${{ github.event.inputs.target || 'all' }}
        run: node scripts/update-wcl-presets.js

      - name: Install Tencent COS SDK
        run: npm install --no-save cos-nodejs-sdk-v5

      - name: Resolve COS upload target
        env:
          WCL_PRESET_TARGET: ${{ github.event.inputs.target || 'all' }}
        run: |
          case "$WCL_PRESET_TARGET" in
            fire-mage)
              echo "WCL_UPLOAD_SOURCE=cos-upload/wcl-presets/data-4.4.x/mage/63" >> "$GITHUB_ENV"
              echo "WCL_UPLOAD_PREFIX=wcl-presets/data-4.4.x/mage/63" >> "$GITHUB_ENV"
              ;;
            windwalker-monk)
              echo "WCL_UPLOAD_SOURCE=cos-upload/wcl-presets/data-4.4.x/monk/269" >> "$GITHUB_ENV"
              echo "WCL_UPLOAD_PREFIX=wcl-presets/data-4.4.x/monk/269" >> "$GITHUB_ENV"
              ;;
            *)
              echo "WCL_UPLOAD_SOURCE=cos-upload/wcl-presets" >> "$GITHUB_ENV"
              echo "WCL_UPLOAD_PREFIX=wcl-presets" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Upload WCL preset data to Tencent COS
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
        run: node scripts/upload-cos-prefix.js --source "$WCL_UPLOAD_SOURCE" --prefix "$WCL_UPLOAD_PREFIX"
