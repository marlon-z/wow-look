name: Update WCL Presets

on:
  workflow_dispatch:
    inputs:
      class_key:
        description: 'Optional class key, for example mage or druid'
        required: false
        type: string
      spec_id:
        description: 'Optional spec id, for example 63, 104, 270'
        required: false
        type: string
      content:
        description: 'all, mythic-plus, or raid'
        required: false
        default: 'all'
        type: string
      levels:
        description: 'Optional M+ levels, for example 10 or 10,16,20'
        required: false
        type: string
      encounter_id:
        description: 'Optional encounter id for quick sampling'
        required: false
        type: string
      top_mplus:
        description: 'Optional M+ preset count per dungeon'
        required: false
        type: string
      top_raid:
        description: 'Optional raid preset count per boss'
        required: false
        type: string
  schedule:
    # 每小时整点跑一组(2个专精)，按时间轮转；约20小时刷完全部40个专精一圈。
    - cron: '0 * * * *'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      specs: ${{ steps.specs.outputs.specs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build spec matrix
        id: specs
        env:
          WCL_CLASS_KEY: ${{ inputs.class_key }}
          WCL_SPEC_ID: ${{ inputs.spec_id }}
        run: echo "specs=$(node scripts/list-wcl-specs.js)" >> "$GITHUB_OUTPUT"

  update:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        spec: ${{ fromJson(needs.prepare.outputs.specs) }}
    timeout-minutes: 60
    name: update-${{ matrix.spec.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve WCL output target
        shell: bash
        run: |
          partial=0
          if [ -n "${{ inputs.content }}" ] && [ "${{ inputs.content }}" != "all" ]; then partial=1; fi
          if [ -n "${{ inputs.levels }}" ]; then partial=1; fi
          if [ -n "${{ inputs.encounter_id }}" ]; then partial=1; fi
          if [ -n "${{ inputs.top_mplus }}" ]; then partial=1; fi
          if [ -n "${{ inputs.top_raid }}" ]; then partial=1; fi
          if [ "$partial" = "1" ]; then
            echo "WCL_OUTPUT_ROOT=cos-upload/wcl-presets-test" >> "$GITHUB_ENV"
            echo "WCL_COS_PREFIX=wcl-presets-test" >> "$GITHUB_ENV"
          else
            echo "WCL_OUTPUT_ROOT=cos-upload/wcl-presets" >> "$GITHUB_ENV"
            echo "WCL_COS_PREFIX=wcl-presets" >> "$GITHUB_ENV"
          fi

      - name: Generate WCL preset data
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
          WCL_CLASS_KEY: ${{ matrix.spec.classKey }}
          WCL_SPEC_ID: ${{ matrix.spec.specId }}
          WCL_CONTENT: ${{ inputs.content }}
          WCL_LEVELS: ${{ inputs.levels }}
          WCL_ENCOUNTER_ID: ${{ inputs.encounter_id }}
          WCL_TOP_MPLUS: ${{ inputs.top_mplus }}
          WCL_TOP_RAID: ${{ inputs.top_raid }}
        run: node scripts/update-wcl-presets.js

      - name: Install Tencent COS SDK
        run: npm install --no-save cos-nodejs-sdk-v5

      - name: Upload WCL preset data to Tencent COS
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
        run: node scripts/upload-cos-prefix.js --source "$WCL_OUTPUT_ROOT/data-4.4.x/${{ matrix.spec.classKey }}/${{ matrix.spec.specId }}" --prefix "$WCL_COS_PREFIX/data-4.4.x/${{ matrix.spec.classKey }}/${{ matrix.spec.specId }}"
