name: Update WCL Presets

on:
  workflow_dispatch:
    inputs:
      class_key:
        description: 'Optional class key, for example mage or druid'
        required: false
        type: string
      spec_id:
        description: 'Optional spec id, for example 63, 104, 270'
        required: false
        type: string
      content:
        description: 'all, mythic-plus, or raid'
        required: false
        default: 'all'
        type: string
  schedule:
    - cron: '20 20 * * *'

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate WCL preset data
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
          WCL_CLASS_KEY: ${{ inputs.class_key }}
          WCL_SPEC_ID: ${{ inputs.spec_id }}
          WCL_CONTENT: ${{ inputs.content }}
        run: node scripts/update-wcl-presets.js

      - name: Install Tencent COS SDK
        run: npm install --no-save cos-nodejs-sdk-v5

      - name: Upload WCL preset data to Tencent COS
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
        run: node scripts/upload-cos-prefix.js --source cos-upload/wcl-presets --prefix wcl-presets
